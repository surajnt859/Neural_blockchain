services:
  - type: web
    name: neuralchain-marketplace
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: NEURAL_TOKEN_ADDRESS
        sync: false
      - key: PINATA_JWT
        sync: false
