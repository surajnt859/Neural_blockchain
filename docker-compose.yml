version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuralchain-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      - MONGODB_URI=${MONGODB_URI:?Set MONGODB_URI in the deployment environment}
      - MARKETPLACE_CONTRACT_ADDRESS=${MARKETPLACE_CONTRACT_ADDRESS:?Set MARKETPLACE_CONTRACT_ADDRESS in the deployment environment}
      - RPC_URL=${RPC_URL:?Set RPC_URL in the deployment environment}
    restart: unless-stopped
